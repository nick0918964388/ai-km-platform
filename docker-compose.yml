version: '3.8'

services:
  # ============================================
  # 資料庫服務
  # ============================================
  
  postgres:
    image: postgres:16-alpine
    container_name: aikm-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/scripts/maximo_schema.sql:/docker-entrypoint-initdb.d/02_maximo.sql:ro
    environment:
      POSTGRES_USER: aikm
      POSTGRES_PASSWORD: aikm
      POSTGRES_DB: aikm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aikm -d aikm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikm-network

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: aikm-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikm-network

  redis:
    image: redis:7-alpine
    container_name: aikm-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikm-network

  # ============================================
  # 應用服務
  # ============================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aikm-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/backups:/app/backups
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://aikm:aikm@postgres:5432/aikm
      # Vector Store
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      # Cache
      REDIS_URL: redis://redis:6379
      CACHE_TTL: 3600
      # Embedding Models
      EMBEDDING_PROVIDER: ollama
      OLLAMA_URL: http://ollama.webtw.xyz:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
      OLLAMA_EMBEDDING_DIMENSION: "768"
      TEXT_EMBEDDING_MODEL: all-MiniLM-L6-v2
      CLIP_MODEL: openai/clip-vit-base-patch32
      # Reranking
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_MODEL: rerank-v3.5
      RERANK_TOP_N: 10
      # LLM Configuration
      LLM_PROVIDER: ollama
      OLLAMA_CHAT_URL: https://j2ollama.nickai.cc/v1
      OLLAMA_CHAT_MODEL: qwen3.5:397b-cloud
      OLLAMA_LIGHT_MODEL: gemma4:31b-cloud
      # Fallback OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aikm-network

  # ============================================
  # Maximo ETL 工具（maximo-data-extractor）
  # ============================================

  maximo-extractor:
    build:
      context: ./maximo-extractor
      dockerfile: Dockerfile
    container_name: aikm-maximo-extractor
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - maximo_extractor_data:/app/data
    environment:
      RELOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aikm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://aikmbackend.nickai.cc
        NEXT_PUBLIC_API_KEY: ${AIKM_API_KEY:-}
    container_name: aikm-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aikm-network

# ============================================
# Networks & Volumes
# ============================================

networks:
  aikm-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  maximo_extractor_data:
