version: '3.8'

services:
  # ============================================
  # 資料庫服務
  # ============================================
  
  postgres:
    image: postgres:16-alpine
    container_name: aikm-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/scripts/maximo_schema.sql:/docker-entrypoint-initdb.d/02_maximo.sql:ro
    environment:
      POSTGRES_USER: aikm
      POSTGRES_PASSWORD: aikm
      POSTGRES_DB: aikm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aikm -d aikm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikm-network

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: aikm-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    # Qdrant image has neither curl nor wget nor python; use bash /dev/tcp for TCP reachability check.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - aikm-network

  redis:
    image: redis:7-alpine
    container_name: aikm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aikm-network

  neo4j:
    image: neo4j:5.20-community
    container_name: aikm-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aikm_neo4j_change_me}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      - aikm-neo4j-data:/data
      - aikm-neo4j-logs:/logs
      - aikm-neo4j-plugins:/plugins
      - aikm-neo4j-import:/var/lib/neo4j/import
    networks:
      - aikm-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # 應用服務
  # ============================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aikm-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/backups:/app/backups
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://aikm:aikm@postgres:5432/aikm
      # Vector Store
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      # Cache
      REDIS_URL: redis://redis:6379
      CACHE_TTL: 3600
      # Embedding Models
      TEXT_EMBEDDING_MODEL: all-MiniLM-L6-v2
      CLIP_MODEL: openai/clip-vit-base-patch32
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama.webtw.xyz:11434
      OLLAMA_EMBEDDING_MODEL: qwen3-embedding:latest
      OLLAMA_EMBEDDING_DIMENSION: "4096"
      # Reranking
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_MODEL: rerank-v3.5
      RERANK_TOP_N: 10
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-ollama}
      OLLAMA_RERANKER_URL: ${OLLAMA_RERANKER_URL:-http://ollama.webtw.xyz:11434}
      OLLAMA_RERANKER_MODEL: ${OLLAMA_RERANKER_MODEL:-linux6200/bge-reranker-v2-m3:latest}
      # LLM Configuration
      LLM_PROVIDER: ollama
      OLLAMA_CHAT_URL: http://ollama.webtw.xyz:11434/v1
      OLLAMA_CHAT_API_KEY: ollama
      OLLAMA_CHAT_MODEL: qwen3.5:397b-cloud
      OLLAMA_LIGHT_MODEL: gemma4:31b-cloud
      # Intent Classification (fast model)
      INTENT_LLM_URL: http://ollama.webtw.xyz:11434/v1
      INTENT_LLM_MODEL: gemma4:31b-cloud
      # Fallback OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # Security — REQUIRED in production, no insecure default
      JWT_SECRET: ${JWT_SECRET}
      ENV: production
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
      # PostgreSQL Viewer (013)
      PG_VIEWER_ENABLED: ${PG_VIEWER_ENABLED:-true}
      PG_VIEWER_DATABASE_URL: ${PG_VIEWER_DATABASE_URL:-}
      PG_VIEWER_ROW_LIMIT: ${PG_VIEWER_ROW_LIMIT:-1000}
      PG_VIEWER_STMT_TIMEOUT_MS: ${PG_VIEWER_STMT_TIMEOUT_MS:-10000}
      PG_VIEWER_SQL_MAX_LEN: ${PG_VIEWER_SQL_MAX_LEN:-8000}
      PG_VIEWER_AUDIT_RETENTION_DAYS: ${PG_VIEWER_AUDIT_RETENTION_DAYS:-180}
      PG_VIEWER_RATE_LIMIT_SQL: ${PG_VIEWER_RATE_LIMIT_SQL:-30}
      PG_VIEWER_RATE_LIMIT_ROWS: ${PG_VIEWER_RATE_LIMIT_ROWS:-60}
      PG_VIEWER_PASSWORD: ${PG_VIEWER_PASSWORD:-}
      PG_VIEWER_AUDIT_PURGER_PASSWORD: ${PG_VIEWER_AUDIT_PURGER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aikm-network

  # ============================================
  # Maximo ETL 工具（maximo-data-extractor）
  # ============================================

  maximo-extractor:
    build:
      context: ./maximo-extractor
      dockerfile: Dockerfile
    container_name: aikm-maximo-extractor
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - maximo_extractor_data:/app/data
    environment:
      RELOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aikm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://aikmbackend.nickai.cc
        NEXT_PUBLIC_API_KEY: ${AIKM_API_KEY:-}
    container_name: aikm-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aikm-network

  # ============================================
  # GitHub Actions Self-hosted Runner
  # ============================================
  # 用於執行 .github/workflows 下的 pipeline（docs-deploy / ci-test / main-deploy）
  # Token 需使用者從 GitHub Repo → Settings → Actions → Runners → New 拿短效 token 放入 .env
  # 詳見 docs/GITHUB_ACTIONS_SETUP.md
  github-runner:
    image: myoung34/github-runner:latest
    container_name: aikm-github-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/nick0918964388/ai-km-platform
      RUNNER_NAME: aikm-runner-01
      RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN:?GITHUB_RUNNER_TOKEN required — 見 docs/GITHUB_ACTIONS_SETUP.md}
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: self-hosted,linux,aikm
      DISABLE_AUTO_UPDATE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/ai-km-platform:/root/ai-km-platform
      - /mnt/disk3/shared:/mnt/disk3/shared
      - aikm-runner-work:/tmp/runner/work
    networks:
      - aikm-network

# ============================================
# Networks & Volumes
# ============================================

networks:
  aikm-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  maximo_extractor_data:
  aikm-neo4j-data:
  aikm-neo4j-logs:
  aikm-neo4j-plugins:
  aikm-neo4j-import:
  aikm-runner-work:
