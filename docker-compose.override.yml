# Override for 192.168.1.162 (elk host) — avoids port conflicts with existing services
# Port conflict resolutions:
#   redis:   6379 → 6380 (6379 taken by ragflow valkey)
#   backend: 8000 → 8003 (8000 taken by mkdocs nginx)
#   frontend: 3000 (free on this host)
# NEXT_PUBLIC_API_URL must match backend port: http://192.168.1.162:8003

services:
  redis:
    ports:
      - "6380:6379"

  backend:
    ports:
      - "8003:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.1.162:8003
        NEXT_PUBLIC_API_KEY: ${AIKM_API_KEY:-}
    ports:
      - "3000:3000"
