# Override for 192.168.1.162 (elk host)
# Port conflicts are handled via .env file:
#   REDIS_HOST_PORT=6380
#   BACKEND_HOST_PORT=8003
# This override rebuilds frontend with the correct API URL for this host.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.1.162:8003
        NEXT_PUBLIC_API_KEY: ${AIKM_API_KEY:-}
