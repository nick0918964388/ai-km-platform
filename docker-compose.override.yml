# Override for 192.168.1.162 (elk host) — avoids port conflicts with existing services
# redis already uses 6380:6379 in base file (avoids conflict with ragflow-redis on 6379)
# backend: remapped to 8003 (8000 taken by mkdocs)
# NEXT_PUBLIC_API_URL matches backend port: http://192.168.1.162:8003

services:
  backend:
    ports:
      - "8003:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.1.162:8003
        NEXT_PUBLIC_API_KEY: ${AIKM_API_KEY:-}
    ports:
      - "3000:3000"
