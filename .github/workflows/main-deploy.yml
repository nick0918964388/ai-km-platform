name: Main Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      REPO_PATH: /root/ai-km-platform
    steps:
      - name: Snapshot current HEAD (for rollback)
        id: snap
        run: |
          set -e
          cd "$REPO_PATH"
          PREV=$(git rev-parse HEAD)
          echo "PREV_COMMIT=$PREV" >> "$GITHUB_OUTPUT"
          echo "Snapshot: $PREV"

      - name: Git pull main
        id: pull
        run: |
          set -e
          cd "$REPO_PATH"
          git fetch origin main
          git checkout main
          git pull origin main
          NEW=$(git rev-parse HEAD)
          echo "NEW_COMMIT=$NEW" >> "$GITHUB_OUTPUT"
          echo "Deploying: $NEW"

      - name: Apply pg_viewer migrations
        # Non-breaking: migration errors are logged as warnings; deploy continues.
        # The rolling update + healthcheck after this step will catch any app-layer
        # breakage caused by a bad migration and trigger the existing rollback step.
        continue-on-error: true
        env:
          PG_VIEWER_PASSWORD: ${{ secrets.PG_VIEWER_PASSWORD }}
          PG_AUDIT_PURGER_PASSWORD: ${{ secrets.PG_AUDIT_PURGER_PASSWORD }}
        run: |
          cd "$REPO_PATH"
          PREV="${{ steps.snap.outputs.PREV_COMMIT }}"
          NEW="${{ steps.pull.outputs.NEW_COMMIT }}"

          # Collect all pg_viewer migration files that changed between commits.
          # On first deploy (no PREV) or if PREV is empty, apply ALL migrations.
          if [ -z "$PREV" ] || [ "$PREV" = "$NEW" ]; then
            CHANGED=$(ls backend/scripts/pg_viewer_migrate_*.sql 2>/dev/null | sort || true)
          else
            CHANGED=$(git diff --name-only "$PREV" "$NEW" -- 'backend/scripts/pg_viewer_migrate_*.sql' 2>/dev/null | sort || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No pg_viewer migration files changed — skipping."
            exit 0
          fi

          echo "Migrations to apply:"
          echo "$CHANGED"

          APPLIED=0
          FAILED=0
          for SQL_FILE in $CHANGED; do
            if [ ! -f "$SQL_FILE" ]; then
              echo "::warning::Migration file not found (deleted?): $SQL_FILE — skipping"
              continue
            fi

            echo "--- Applying $SQL_FILE ---"
            # Migrations 001 and 002 require psql variable substitution for passwords.
            # Migration 003 runs as aikm (no special vars needed).
            BASENAME=$(basename "$SQL_FILE")
            if echo "$BASENAME" | grep -qE '^pg_viewer_migrate_00[12]_'; then
              if [ -z "$PG_VIEWER_PASSWORD" ] || [ -z "$PG_AUDIT_PURGER_PASSWORD" ]; then
                echo "::warning::PG_VIEWER_PASSWORD or PG_AUDIT_PURGER_PASSWORD secret is empty — cannot apply $BASENAME safely. Set secrets and re-deploy."
                FAILED=$((FAILED + 1))
                continue
              fi
              docker exec -i aikm-postgres \
                psql -U aikm -d aikm \
                  -v "pg_viewer_password=${PG_VIEWER_PASSWORD}" \
                  -v "pg_audit_purger_password=${PG_AUDIT_PURGER_PASSWORD}" \
                  -v ON_ERROR_STOP=1 \
                < "$SQL_FILE" \
                && APPLIED=$((APPLIED + 1)) \
                || {
                  echo "::warning::Migration $BASENAME failed — continuing deploy"
                  FAILED=$((FAILED + 1))
                }
            else
              docker exec -i aikm-postgres \
                psql -U aikm -d aikm \
                  -v ON_ERROR_STOP=1 \
                < "$SQL_FILE" \
                && APPLIED=$((APPLIED + 1)) \
                || {
                  echo "::warning::Migration $BASENAME failed — continuing deploy"
                  FAILED=$((FAILED + 1))
                }
            fi
          done

          echo "Migration summary: applied=$APPLIED failed=$FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED migration(s) failed. Check logs above. Deploy will continue."
          fi

      - name: Build backend + frontend
        run: |
          set -e
          cd "$REPO_PATH"
          docker compose build backend frontend 2>&1 | tail -40

      - name: Rolling update backend
        run: |
          set -e
          cd "$REPO_PATH"
          docker compose up -d backend
          sleep 40

      - name: Backend healthcheck
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 5 http://aikm-backend:8000/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Backend OK (200) at retry $i"
              exit 0
            fi
            echo "Backend not ready ($code), retry $i/12"
            sleep 5
          done
          echo "::error::Backend health check failed after 12 retries (~100s)"
          exit 1

      - name: Rolling update frontend
        run: |
          set -e
          cd "$REPO_PATH"
          docker compose up -d frontend
          sleep 15

      - name: Frontend healthcheck
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 5 http://aikm-frontend:3000/ || echo "000")
          echo "Frontend HTTP: $code"
          if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "302" ]; then
            echo "Frontend OK"
            exit 0
          fi
          echo "::error::Frontend bad status $code"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.snap.outputs.PREV_COMMIT != ''
        run: |
          cd "$REPO_PATH"
          echo "::warning::Rolling back to ${{ steps.snap.outputs.PREV_COMMIT }}"
          git reset --hard ${{ steps.snap.outputs.PREV_COMMIT }}
          docker compose up -d --build backend frontend 2>&1 | tail -30
          sleep 25
          curl -sS -o /dev/null -w "Rollback backend health: %{http_code}\n" -m 5 http://localhost:8000/health || true
          echo "Rollback done"

      - name: Deploy summary
        if: always()
        run: |
          cd "$REPO_PATH"
          CURRENT=$(git rev-parse HEAD)
          {
            echo "### Deploy Result"
            echo "- Previous: ${{ steps.snap.outputs.PREV_COMMIT }}"
            echo "- Target: ${{ steps.pull.outputs.NEW_COMMIT }}"
            echo "- Current (after job): $CURRENT"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
